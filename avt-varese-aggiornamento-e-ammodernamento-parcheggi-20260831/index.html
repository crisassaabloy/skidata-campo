<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKIDATA</title><style>
:root{--sk-black:#1A1A1A;--sk-50:#F7F7F7;--sk-200:#E0E0E0;--sk-300:#B0B0B0;
--sk-500:#6B6B6B;--sk-red:#C0392B}
*{box-sizing:border-box}
body{margin:0;padding:0 0 40px;background:#F0F0F0;color:var(--sk-black);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
font-size:14px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px}
.testata{display:flex;justify-content:space-between;align-items:flex-start;
gap:12px;padding:16px 4px;border-bottom:2px solid var(--sk-black);
margin-bottom:14px;flex-wrap:wrap}
.marchio{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
.marchio span{display:block;font-size:9px;font-weight:600;letter-spacing:2px;
color:var(--sk-500);margin-top:3px}
.intest{text-align:right}
.prog{font-size:13px;font-weight:700;text-transform:uppercase}
.cli{font-size:12px;color:var(--sk-500)}
.panel{background:#fff;border:1px solid var(--sk-200);border-radius:6px;
margin-bottom:14px;overflow:hidden}
.panel-head{background:var(--sk-black);color:#fff;padding:10px 14px;
font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
display:flex;align-items:center}
.area{font-size:11px;font-weight:700;text-transform:uppercase;
letter-spacing:.6px;color:var(--sk-500);margin:12px 0 5px;padding-bottom:3px;
border-bottom:1px solid var(--sk-200)}
table.art{width:100%;border-collapse:collapse}
table.art th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;
color:var(--sk-500);text-align:left;padding:4px 6px;font-weight:600}
table.art td{padding:5px 6px;border-top:1px solid var(--sk-50);
vertical-align:top}
table.art td.q,table.art th.q{width:44px;text-align:right;font-weight:700}
table.art td.c,table.art th.c{width:110px;color:var(--sk-500);
font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
#gate{max-width:380px;margin:16vh auto 0;padding:0 20px;text-align:center}
#gate .marchio{text-align:center;margin-bottom:22px}
#gate input{width:100%;font-size:16px;padding:13px;border:1px solid var(--sk-200);
border-radius:6px;margin-bottom:10px;font-family:inherit}
#gate button{width:100%;min-height:48px;font-size:15px;font-weight:600;
background:var(--sk-black);color:#fff;border:none;border-radius:6px;
cursor:pointer;font-family:inherit}
#gate .err{color:var(--sk-red);font-size:13px;min-height:20px;margin-top:10px}
#gate .nota{color:var(--sk-500);font-size:11px;margin-top:18px;line-height:1.5}
@media (max-width:640px){.intest{text-align:left}.testata{padding:12px 4px}}
/* pannelli richiudibili, come nella dashboard locale */
.panel-head.collapsible{cursor:pointer;user-select:none;transition:background .15s}
.panel-head.collapsible:hover{background:#2c2c2c}
.panel-chev{color:#fff;font-size:11px;margin-left:10px;transition:transform .2s;
opacity:.7}
.panel-head.collapsible.open .panel-chev{transform:rotate(180deg)}
.panel-body-wrapper{overflow:hidden;transition:max-height .25s ease-out;max-height:0}
.panel-body-wrapper.open{max-height:200000px}

var D = window.__DATI__;
function b2a(b64){
  var s=atob(b64), n=s.length, u=new Uint8Array(n);
  while(n--) u[n]=s.charCodeAt(n);
  return u;
}
function msg(t){ document.getElementById('err').textContent = t||''; }

async function apri(pw, silenzioso){
  if(!pw){ msg('Inserisci la password.'); return false; }
  var bottone = document.getElementById('vai');
  if(bottone && !silenzioso){ bottone.disabled=true; bottone.textContent='Apro...'; }
  try{
    var base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var chiave = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b2a(D.s), iterations:D.i, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var chiaro = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:b2a(D.n)}, chiave, b2a(D.c));
    mostra(new TextDecoder().decode(chiaro));
    try{ localStorage.setItem('campo_pw_'+D.k, pw); }catch(e){}
    return true;
  }catch(e){
    try{ localStorage.removeItem('campo_pw_'+D.k); }catch(e2){}
    if(!silenzioso) msg('Password errata.');
    if(bottone){ bottone.disabled=false; bottone.textContent='Apri'; }
    return false;
  }
}


/* v2.1.20: stessi pannelli richiudibili della dashboard.
   Va chiamato DOPO l'iniezione del contenuto decifrato. */
function _campoCollasso(radice, chiave){
  var panels = radice.querySelectorAll('.panel');
  Array.prototype.forEach.call(panels, function(panel, idx){
    var head = panel.querySelector('.panel-head');
    if(!head || head.classList.contains('collapsible')) return;
    var etichetta = head.querySelector('span');
    var pid = panel.id || (etichetta ? etichetta.textContent.trim().slice(0,40)
                                     : 'panel_'+idx);
    var kv = 'campo_panel_' + chiave + '_' + pid;
    if(!head.querySelector('.panel-chev')){
      var chev = document.createElement('span');
      chev.className = 'panel-chev';
      chev.innerHTML = '&#9660;';
      head.appendChild(chev);
    }
    head.classList.add('collapsible');
    var corpi = [], cur = head.nextElementSibling;
    while(cur){ corpi.push(cur); cur = cur.nextElementSibling; }
    if(!corpi.length) return;
    var box = document.createElement('div');
    box.className = 'panel-body-wrapper';
    corpi.forEach(function(c){ box.appendChild(c); });
    panel.appendChild(box);
    var salvato = null;
    try{ salvato = localStorage.getItem(kv); }catch(e){}
    if(salvato !== 'closed'){ head.classList.add('open'); box.classList.add('open'); }
    head.addEventListener('click', function(e){
      if(e.target.closest('input, button, select, textarea, label, .rlv-foto')) return;
      var aperto = box.classList.toggle('open');
      head.classList.toggle('open', aperto);
      try{ localStorage.setItem(kv, aperto ? 'open' : 'closed'); }catch(e2){}
    });
  });
}

function mostra(html){
  var g=document.getElementById('gate'); if(g) g.remove();
  var app=document.getElementById('app');
  app.innerHTML = html;
  /* innerHTML non esegue gli script: li ricreo uno per uno */
  var vecchi = app.querySelectorAll('script');
  for(var i=0;i<vecchi.length;i++){
    var v=vecchi[i], nuovo=document.createElement('script');
    for(var j=0;j<v.attributes.length;j++){
      nuovo.setAttribute(v.attributes[j].name, v.attributes[j].value);
    }
    nuovo.appendChild(document.createTextNode(v.textContent));
    v.parentNode.replaceChild(nuovo, v);
  }
  var t = app.querySelector('.prog');
  if(t) document.title = t.textContent.slice(0,60);
  _campoCollasso(app, D.k);      /* v2.1.20 */
}

window.addEventListener('DOMContentLoaded', function(){
  var salvata=null;
  try{ salvata = localStorage.getItem('campo_pw_'+D.k); }catch(e){}
  if(salvata){ apri(salvata, true); }
  var b=document.getElementById('vai');
  if(b) b.addEventListener('click', function(){
    apri(document.getElementById('pw').value, false);
  });
  var p=document.getElementById('pw');
  if(p) p.addEventListener('keydown', function(e){
    if(e.key==='Enter') apri(p.value, false);
  });
});
</script></body></html>
